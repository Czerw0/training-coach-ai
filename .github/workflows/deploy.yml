name: Deploy to Oracle VM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/training-coach-ai
            git pull
            docker build -t training-coach .
            docker stop coach || true
            docker rm coach || true
            docker run -d --name coach --env-file .env -p 8000:8000 training-coach
            docker image prune -f