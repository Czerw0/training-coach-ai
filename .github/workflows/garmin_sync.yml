name: Daily Garmin Sync

on:
  schedule:
    - cron: '0 4,6,8,10,12,14,16,18,21 * * *'   # UTC; ~6:00–23:00 Warsaw, every 2-3h
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Garmin sync
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: 'False'
          ALLOWED_HOSTS: 'localhost'
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python manage.py sync_garmin

      # Emails an AI-coach insight for each newly synced endurance/strength
      # workout. Runs after the sync so new activities are already in the DB.
      # Needs ANTHROPIC_API_KEY (agent) + EMAIL/EMAIL_PASSWORD (Gmail SMTP).
      - name: Notify new workouts
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: 'False'
          ALLOWED_HOSTS: 'localhost'
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL: ${{ secrets.EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python manage.py notify_new_workouts