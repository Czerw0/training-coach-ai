version: '3.8'

# HTTPS groundwork (see deploy/Caddyfile). Not yet used by the live deploy —
# .github/workflows/deploy.yml still runs a raw `docker run` against this
# Dockerfile directly. This compose file is for local use / a future cutover
# once a real domain is pointed at the VM.
#
# With caddy in front, "web" is no longer published to the host directly —
# only 80/443 are, via caddy. Do NOT publish web's port 8000 on the host once
# this is the real deploy path, or requests could bypass Caddy (and its TLS)
# entirely and hit gunicorn in plaintext.
services:
  web:
    build: .
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - COACH_DOMAIN=${COACH_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config: