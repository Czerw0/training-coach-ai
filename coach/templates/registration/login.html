{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F6FA">
  <link rel="icon" type="image/svg+xml" href="{% static 'coach/img/apexfit.svg' %}">
  <title>Sign in · ApexFit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=Public+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{% static 'coach/css/app.css' %}">
  <style>
    body { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(1200px 600px at 50% -10%, var(--accent-soft), var(--bg)); }
    .login { width: 100%; max-width: 380px; display: grid; gap: 18px; }
    .login .logo { justify-self: center; } .login .logo svg { width: 40px; height: 40px; } .login .logo b { font-size: 32px; }
    .login .card { padding: 24px 22px; gap: 14px; }
    .login h1 { font-family: var(--f-num); font-size: 24px; font-weight: 700; }
    .login .sub { color: var(--muted); font-size: 14px; margin-top: -8px; }
    .error { background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad); border-radius: var(--r-sm); padding: 10px 12px; font-size: 13.5px; }
    .login .btn { width: 100%; padding: 12px; font-size: 15px; margin-top: 4px; }
  </style>
</head>
<body>
  <main class="login">
    <div class="logo">{% include "coach/_logo.html" %}<b>Apex<span>Fit</span></b></div>
    <div class="card">
      <h1>Sign in</h1>
      <p class="sub">Train with Apex, your AI coach.</p>

      {% if form.errors %}
        <div class="error" role="alert">Incorrect username or password. Try again.</div>
      {% endif %}

      <form method="post" action="{% url 'login' %}" style="display:grid; gap:12px;">
        {% csrf_token %}
        <div class="field">
          <label for="id_username">Username</label>
          <input class="input" type="text" name="username" id="id_username" autocomplete="username" autocapitalize="none" autofocus required>
        </div>
        <div class="field">
          <label for="id_password">Password</label>
          <input class="input" type="password" name="password" id="id_password" autocomplete="current-password" required>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn" type="submit">Sign in</button>
      </form>
    </div>
  </main>
</body>
</html>
