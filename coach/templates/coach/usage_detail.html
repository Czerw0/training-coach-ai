<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turn detail · Training Coach</title>
    <style>
        :root {
            --navy:#0B1F3A; --blue:#2D6CDF; --ink:#11151C;
            --ink-soft:#6B7585; --line:#E4E8EF; --surface:#FFFFFF;
            --bg:#F4F6F9; --pill-bg:#EDF0F5; --amber:#BA7517; --green:#1D9E75;
        }
        * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
        html, body { height:100%; }
        body {
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
            background:var(--bg); color:var(--ink);
            height:100dvh; display:flex; justify-content:center; align-items:stretch;
        }
        .app {
            width:100%; max-width:520px; display:flex; flex-direction:column;
            height:100dvh; background:var(--bg); overflow:hidden;
        }
        @media (min-width:600px) {
            body { padding:24px; align-items:center; }
            .app {
                height:min(900px, calc(100dvh - 48px));
                border:1px solid var(--line); border-radius:22px;
                box-shadow:0 10px 40px rgba(11,31,58,0.10); background:var(--surface);
            }
        }

        .topbar { flex-shrink:0; padding:max(12px, env(safe-area-inset-top)) 12px 0; }
        .pill {
            display:flex; align-items:center; gap:10px;
            background:var(--pill-bg); border-radius:999px; padding:8px 8px 8px 12px;
        }
        .logo {
            width:30px; height:30px; border-radius:50%; background:var(--navy); color:#fff;
            display:flex; align-items:center; justify-content:center;
            font-weight:700; font-size:14px; flex-shrink:0;
        }
        .pill .name { font-size:15px; font-weight:650; flex:1; }
        .back {
            display:flex; align-items:center; gap:6px;
            background:var(--surface); border:1px solid var(--line); border-radius:999px;
            padding:6px 13px; font-size:13px; font-weight:600; color:var(--navy);
            cursor:pointer; text-decoration:none;
        }
        .back svg { width:16px; height:16px; stroke:var(--navy); fill:none; stroke-width:1.9; }

        .scroll { flex:1; overflow-y:auto; padding:14px; -webkit-overflow-scrolling:touch; }

        .meta-line { font-size:12px; color:var(--ink-soft); margin-bottom:14px; }
        .meta-line .cost { color:var(--navy); font-weight:700; }

        .section-title { font-size:13px; font-weight:700; color:var(--ink-soft); margin:14px 2px 8px; }

        .bubble {
            background:var(--surface); border:1px solid var(--line);
            border-radius:14px; padding:13px 14px; font-size:14px; white-space:pre-wrap;
        }
        @media (min-width:600px) { .bubble { background:var(--bg); } }

        .trace { display:flex; flex-direction:column; gap:8px; }
        .call {
            background:var(--surface); border:1px solid var(--line);
            border-radius:12px; padding:11px 13px;
        }
        @media (min-width:600px) { .call { background:var(--bg); } }
        .call .tool { font-size:13px; font-weight:700; color:var(--blue); }
        .call pre {
            font-size:11.5px; background:var(--pill-bg); border-radius:8px;
            padding:8px; margin-top:6px; overflow-x:auto; white-space:pre-wrap; word-break:break-word;
        }
        .call .label { font-size:10.5px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; margin-top:8px; }

        .empty { text-align:center; color:var(--ink-soft); padding:30px; font-size:14px; }
    </style>
</head>
<body>
    <div class="app">
        <div class="topbar">
            <div class="pill">
                <div class="logo">TC</div>
                <div class="name">Turn detail</div>
                <a class="back" href="/usage/">
                    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    Usage
                </a>
            </div>
        </div>

        <div class="scroll" id="content">
            <div class="empty">Loading…</div>
        </div>
    </div>

    <script>
        const usageId = {{ usage_id }};

        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        async function load() {
            const content = document.getElementById('content');
            let data;
            try {
                data = await fetch(`/usage/${usageId}/data/`).then(r => r.json());
            } catch (e) {
                content.innerHTML = '<div class="empty">Could not load this turn.</div>';
                return;
            }

            let html = `<div class="meta-line">${data.when} &middot; ${data.model} &middot; ` +
                `${data.config_version} &middot; ${data.prompt_version} &middot; ` +
                `<span class="cost">$${data.cost.toFixed(4)}</span> &middot; ` +
                `${data.input.toLocaleString()} in / ${data.output.toLocaleString()} out ` +
                `(${data.cache_read.toLocaleString()} cache-read) &middot; ${data.api_calls} API call(s)</div>`;

            html += '<div class="section-title">User message</div>';
            html += `<div class="bubble">${data.user_message ? escapeHtml(data.user_message) : '(no message)'}</div>`;

            html += '<div class="section-title">Tool calls</div>';
            if (!data.tool_trace.length) {
                html += '<div class="empty">No tools called this turn.</div>';
            } else {
                html += '<div class="trace">';
                data.tool_trace.forEach(t => {
                    html += `<div class="call"><div class="tool">${escapeHtml(t.tool)}</div>` +
                        `<div class="label">Input</div><pre>${escapeHtml(JSON.stringify(t.input, null, 2))}</pre>` +
                        `<div class="label">Result</div><pre>${escapeHtml(t.result)}</pre></div>`;
                });
                html += '</div>';
            }

            html += '<div class="section-title">Final reply</div>';
            html += `<div class="bubble">${data.final_text ? escapeHtml(data.final_text) : '(none)'}</div>`;

            content.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', load);
    </script>
</body>
</html>
