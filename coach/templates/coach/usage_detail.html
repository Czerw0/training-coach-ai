{% extends "coach/base.html" %}
{% block title %}Turn {{ usage_id }} · ApexFit{% endblock %}
{% block mobile_title %}Turn detail{% endblock %}

{% block head %}
<style>
  .meta-line { display: flex; flex-wrap: wrap; gap: 6px; }
  .bubble { background: var(--sunken); border-radius: var(--r-sm); padding: 12px 14px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .call { display: grid; gap: 6px; padding: 12px 0; border-top: 1px solid var(--line); }
  .call:first-child { border-top: 0; padding-top: 0; }
  .call .tool { font-weight: 700; color: var(--accent); }
  .back { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; text-decoration: none; }
</style>
{% endblock %}

{% block content %}
<div class="main-inner" style="max-width: 900px;">
  <div class="page-head">
    <div>
      <a class="back" href="/usage/">← Usage</a>
      <h1>Turn {{ usage_id }}</h1>
    </div>
  </div>
  <div id="content" class="grid"><div class="empty">Loading…</div></div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const usageId = {{ usage_id }};
  const e = TC.escapeHtml;

  async function load() {
    const content = document.getElementById('content');
    let d;
    try { d = await fetch(`/usage/${usageId}/data/`).then(r => r.json()); }
    catch (err) { content.innerHTML = '<div class="empty">Could not load this turn.</div>'; return; }

    const calls = d.tool_trace.length
      ? d.tool_trace.map(t => `<div class="call"><div class="tool">${e(t.tool)}</div>` +
          `<div class="k">Input</div><pre class="code">${e(JSON.stringify(t.input, null, 2))}</pre>` +
          `<div class="k">Result</div><pre class="code">${e(t.result)}</pre></div>`).join('')
      : '<div class="empty">No tools called this turn.</div>';

    content.innerHTML =
      `<div class="meta-line"><span class="chip muted">${e(d.when)}</span><span class="chip acc">${e(d.model)}</span>` +
      `<span class="chip muted">${e(d.config_version)}</span><span class="chip muted">${e(d.prompt_version)}</span>` +
      `<span class="chip muted">$${d.cost.toFixed(4)}</span>` +
      `<span class="chip muted">${d.input.toLocaleString()} in / ${d.output.toLocaleString()} out · ${d.cache_read.toLocaleString()} cache-read</span>` +
      `<span class="chip muted">${d.api_calls} API call(s)</span></div>` +
      `<section class="card"><div class="card-head"><h2>Message</h2></div><div class="bubble">${d.user_message ? e(d.user_message) : '(no message)'}</div></section>` +
      `<section class="card"><div class="card-head"><h2>Tool calls</h2></div>${calls}</section>` +
      `<section class="card"><div class="card-head"><h2>Final reply</h2></div><div class="bubble">${d.final_text ? e(d.final_text) : '(none)'}</div></section>`;
  }
  document.addEventListener('DOMContentLoaded', load);
</script>
{% endblock %}
