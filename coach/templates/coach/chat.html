<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Coach</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: #f0f2f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: #1a73e8;
            color: white;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #reset { background: rgba(255,255,255,0.2); border: none; color: white;
                 padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 16px;
               white-space: pre-wrap; line-height: 1.45; font-size: 15px; }
        .user { background: #1a73e8; color: white; align-self: flex-end;
                border-bottom-right-radius: 4px; }
        .coach { background: white; color: #1c1c1e; align-self: flex-start;
                 border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .typing { color: #888; font-style: italic; align-self: flex-start; }
        #input-area { display: flex; padding: 12px; background: white;
                      border-top: 1px solid #ddd; gap: 8px; }
        #input { flex: 1; padding: 12px; border: 1px solid #ccc;
                 border-radius: 20px; font-size: 15px; outline: none; }
        #send { background: #1a73e8; color: white; border: none;
                border-radius: 20px; padding: 12px 20px; font-size: 15px; cursor: pointer; }
        #send:disabled { opacity: 0.5; }
    </style>
</head>
<body>
    <header>
        <span>🚴 Training Coach</span>
        <button id="reset">New chat</button>
    </header>
    <div id="messages"></div>
    <div id="input-area">
        <input id="input" type="text" placeholder="Ask your coach..." autocomplete="off">
        <button id="send">Send</button>
    </div>

    <script>
        const messages = document.getElementById('messages');
        const input = document.getElementById('input');
        const send = document.getElementById('send');
        const reset = document.getElementById('reset');

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }

        function addMessage(text, cls) {
            const div = document.createElement('div');
            div.className = 'msg ' + cls;
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return div;
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;
            addMessage(text, 'user');
            input.value = '';
            send.disabled = true;

            const typing = addMessage('Coach is thinking...', 'typing');

            try {
                const res = await fetch('/message/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken'),
                    },
                    body: JSON.stringify({ message: text }),
                });
                const data = await res.json();
                typing.remove();
                if (data.reply) {
                    addMessage(data.reply, 'coach');
                } else {
                    addMessage('Error: ' + (data.error || 'unknown'), 'coach');
                }
            } catch (e) {
                typing.remove();
                addMessage('Network error: ' + e.message, 'coach');
            }
            send.disabled = false;
            input.focus();
        }

        send.addEventListener('click', sendMessage);
        input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
        reset.addEventListener('click', async () => {
            await fetch('/reset/', {
                method: 'POST',
                headers: { 'X-CSRFToken': getCookie('csrftoken') },
            });
            messages.innerHTML = '';
        });

        input.focus();
    </script>
</body>
</html>
